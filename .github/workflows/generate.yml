name: Generate SDKs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generate-sdks
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: nodejs/package-lock.json

      - name: Sync openapi.json
        run: curl -sf https://docs.payzu.com.br/openapi.json -o openapi.json

      - name: Generate
        run: ./scripts/generate.sh

      - name: Validate Node.js SDK
        working-directory: nodejs
        run: |
          npm ci
          npm run build
          npm run typecheck
          npm test

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "SDKs já em dia com openapi.json"
            exit 0
          fi
          git config user.name "PayZu SDK Bot"
          git config user.email "noreply@payzu.com.br"
          git switch -C bot/regenerate-sdks
          git add -A
          git commit -m "chore(sdks): regenerar de openapi.json"
          git push --force origin bot/regenerate-sdks
          if [ -z "$(gh pr list --head bot/regenerate-sdks --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head bot/regenerate-sdks \
              --title "chore(sdks): regenerar SDKs de openapi.json" \
              --body "SDKs regenerados a partir de docs.payzu.com.br/openapi.json."
          fi
