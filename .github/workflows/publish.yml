name: Publish SDKs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão (ex: 3.0.0)'
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.version || github.event.release.tag_name }}

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Update npm for trusted publishing
        run: npm install -g npm@latest
      - name: Build
        working-directory: nodejs
        run: |
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --allow-same-version
          npm ci
          npm run build
          npm test
      - name: Publish
        working-directory: nodejs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -n "$(npm view "payzu-pix@$VERSION" version 2>/dev/null || true)" ]; then
            echo "payzu-pix@$VERSION já publicado"
          else
            npm publish
          fi

  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build
        working-directory: python
        run: |
          VERSION="${RELEASE_TAG#v}"
          sed -i "s/^VERSION = .*/VERSION = \"$VERSION\"/" setup.py
          sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml
          python -m pip install --upgrade build twine
          python -m build
      - name: Publish
        working-directory: python
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
        run: twine upload --skip-existing dist/*

  rubygems:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - name: Build
        working-directory: ruby
        run: |
          sed -i "s/VERSION = '.*'/VERSION = '${RELEASE_TAG#v}'/" lib/payzu-pix/version.rb
          gem build payzu-pix.gemspec
      - name: Publish
        working-directory: ruby
        run: |
          VERSION="${RELEASE_TAG#v}"
          if gem list --remote --exact payzu-pix --all | grep -q "[( ]$VERSION[,)]"; then
            echo "payzu-pix $VERSION já publicado"
            exit 0
          fi
          OIDC=$(curl -sf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          GEM_HOST_API_KEY=$(curl -sf -X POST -H "Content-Type: application/json" \
            -d "{\"jwt\":\"$OIDC\"}" \
            https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token | jq -r .rubygems_api_key)
          export GEM_HOST_API_KEY
          gem push "payzu-pix-$VERSION.gem"

  maven-central:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Import signing key
        env:
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
        run: |
          mkdir -m 700 -p ~/.gnupg
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "$MAVEN_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Build signed bundle
        working-directory: java
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          mvn -B -q versions:set -DnewVersion="${RELEASE_TAG#v}" -DgenerateBackupPoms=false
          mvn -B -Psign-artifacts -DskipTests -Dgpg.passphrase="$MAVEN_GPG_PASSPHRASE" \
            deploy -DaltDeploymentRepository="staging::file://$PWD/target/staging"
          cd target/staging
          find . -name 'maven-metadata.xml*' -delete
          zip -qr ../bundle.zip .
      - name: Upload to Maven Central
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
        run: |
          AUTH=$(printf '%s:%s' "$MAVEN_CENTRAL_USERNAME" "$MAVEN_CENTRAL_PASSWORD" | base64 -w0)
          API=https://central.sonatype.com/api/v1/publisher
          ID=$(curl -sf -H "Authorization: Bearer $AUTH" -F bundle=@java/target/bundle.zip \
            "$API/upload?name=payzu-pix-${RELEASE_TAG#v}&publishingType=AUTOMATIC")
          echo "deployment $ID"
          for _ in $(seq 1 90); do
            STATUS=$(curl -sf -X POST -H "Authorization: Bearer $AUTH" "$API/status?id=$ID")
            STATE=$(echo "$STATUS" | jq -r .deploymentState)
            echo "$STATE"
            case "$STATE" in
              PUBLISHING|PUBLISHED) exit 0 ;;
              FAILED) echo "$STATUS" | jq .errors; exit 1 ;;
            esac
            sleep 20
          done
          exit 1
