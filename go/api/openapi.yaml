                    status: ERROR
                    error: Unauthorized
                    errorCode: PZA100
                    message: Unauthorized
                    statusCode: 401
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failure
        "403":
          content:
            application/json:
              examples:
                PZK400:
                  summary: Pix key lookup not enabled for the user.
