          nullable: true
          type: string
        refundDescription:
          description: Description of the refund
          nullable: true
          type: string
        refundedAt:
          description: Date and time when the refund was processed
          nullable: true
          type: string
        cancellationReason:
          description: Reason for cancellation (if cancelled)
