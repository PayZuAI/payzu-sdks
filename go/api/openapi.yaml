  /proof/{id}:
    get:
      description: "Returns the transaction receipt. By default (`type=pdf`) the response\
        \ is the PDF file; with `type=base64` it is JSON with the `base64` field,\
        \ the PDF as a data URI."
      externalDocs:
        description: Receber pagamento Pix
        url: /docs/pix-processamento/tutoriais/receive-pix
      operationId: get_proof
      parameters:
      - description: Transaction ID.
        example: PAYZU20260814T6NX1CV9MK000000
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Return format.
        example: pdf
        explode: true
        in: query
        name: type
        required: false
        schema:
          default: pdf
          enum:
          - pdf
          - base64
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                base64:
                  summary: As Base64
                  value:
                    base64: "data:application/pdf;base64,JVBERi0xLjQKJ..."
              schema:
                $ref: "#/components/schemas/ProofResponse"
            application/pdf:
              schema:
                description: "Binary PDF (default format, when `type=pdf`)."
                format: binary
                type: string
          description: "Base64 if `type=base64`, otherwise binary PDF."
        "400":
          content:
            application/json:
              examples:
                PZV001:
                  summary: Invalid data. Check the fields provided.
                  value:
                    status: ERROR
                    error: Bad Request
                    errorCode: PZV001
                    message: Invalid data. Check the fields provided.
                    statusCode: 400
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                    details:
                    - field: type
                      message: "Invalid option: expected one of \"base64\"|\"pdf\""
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Bad Request, payload or query string failed validation"
        "401":
          content:
            application/json:
              examples:
                PZA100:
                  summary: Unauthorized
                  value:
                    status: ERROR
                    error: Unauthorized
                    errorCode: PZA100
                    message: Unauthorized
                    statusCode: 401
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Missing or invalid Bearer token
        "404":
          content:
            application/json:
              examples:
                PZG404:
                  summary: Transaction not found
                  value:
                    status: ERROR
                    error: Not Found
                    errorCode: PZG404
                    message: Transaction not found
                    statusCode: 404
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
        "422":
          content:
            application/json:
              examples:
                PZC320:
                  summary: Transaction not yet processed.
                  value:
                    status: ERROR
                    error: Unprocessable Entity
                    errorCode: PZC320
                    message: Transaction not yet processed.
                    statusCode: 422
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZC321:
