      properties:
        id:
          description: Identifier of the transaction at PayZu.
          type: string
        status:
          description: "PENDING, COMPLETED, CANCELED, WAITING_FOR_REFUND, REFUNDED,\
            \ EXPIRED, ERROR"
          enum:
          - PENDING
          - COMPLETED
          - CANCELED
          - WAITING_FOR_REFUND
          - REFUNDED
          - EXPIRED
          - ERROR
          type: string
        amount:
          description: "Amount of the transaction, before the fee."
          type: number
        type:
          description: "Transaction type: DEPOSIT, WITHDRAW, COMMISSION, LIQUIDATION\
            \ or ADJUSTMENT."
          enum:
          - DEPOSIT
          - WITHDRAW
          - COMMISSION
          - LIQUIDATION
          - ADJUSTMENT
          type: string
        qrCodeText:
          description: Copy-and-paste Pix code.
          nullable: true
          type: string
        qrCodeBase64:
          description: "PNG image of the QR Code in base64, without the data: prefix."
          nullable: true
          type: string
        qrCodeUrl:
          description: Authenticated route that returns the PNG of the QR Code.
          nullable: true
          type: string
        generatedName:
          description: Name used to build the charge.
          nullable: true
          type: string
        generatedDocument:
          description: CPF or CNPJ used as the debtor of the charge.
          nullable: true
          type: string
        generatedEmail:
          description: Email used to build the charge.
          nullable: true
          type: string
        payerName:
          description: "Name of the holder of the account that sent the Pix, as reported\
            \ by the originating institution."
          nullable: true
          type: string
        payerDocument:
          description: "CPF or CNPJ of the payer of the Pix, reported by the originating\
            \ institution."
          nullable: true
          type: string
        payerInstitutionIspb:
          description: ISPB code of the institution the Pix was sent from.
          nullable: true
          type: string
        payerInstitutionName:
          description: Name of the institution the Pix was sent from.
          nullable: true
          type: string
        payerAccountNumber:
          description: "Payer's PayZu account number (6 digits). Present on withdraw,\
            \ internal-transfer and commission transactions."
          nullable: true
          type: string
        serviceFeeCharged:
          description: "PayZu fee charged on the operation, in reais. It may carry\
            \ more than two decimal places — do not round when reconciling."
          nullable: true
          type: number
        withdrawPixKey:
          description: "Destination Pix key of the withdrawal, already normalized."
          nullable: true
          type: string
