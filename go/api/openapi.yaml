                  summary: Forbidden
                  value:
                    status: ERROR
                    error: Forbidden
                    errorCode: PZA200
                    message: Forbidden
                    statusCode: 403
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZA203:
                  summary: Acesso não permitido a partir do endereço de IP 203.0.113.10.
                  value:
                    status: ERROR
                    error: Forbidden
