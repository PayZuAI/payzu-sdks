                      Tente novamente em instantes.
                    statusCode: 424
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                    retryAfterSeconds: 5
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Falha na instituição financeira
      security:
      - BearerAuth: []
      summary: Criar Cobrança (depósito Pix)
      tags:
      - Pix Operations
      x-codeSamples:
      - id: curl
        lang: bash
        label: cURL
        source: |-
          curl --request POST \
            --url 'https://api.pix.payzu.com.br/v1/pix' \
            --header "Authorization: Bearer $PAYZU_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{
            "amount": 10.9,
            "callbackUrl": "https://webhook.cool/",
            "generatedName": "John Doe",
            "generatedEmail": "john.doe@example.com",
            "generatedDocument": "12345678901",
            "expiresIn": 600,
            "clientReference": "order_12345",
            "virtualAccount": "loja-centro-01"
          }'
      - id: js
        lang: js
        label: Node.js
        source: |-
          import { PayZu } from 'payzu-pix';

          const payzu = new PayZu({ token: process.env.PAYZU_TOKEN });

          const charge = await payzu.pix.create({
            amount: 10.9,
            callbackUrl: 'https://webhook.cool/',
            generatedName: 'John Doe',
            generatedEmail: 'john.doe@example.com',
            generatedDocument: '12345678901',
            expiresIn: 600,
            clientReference: 'order_12345',
            virtualAccount: 'loja-centro-01'
          });

          console.log(charge.id, charge.status, charge.qrCodeText);
      - id: python
        lang: python
        label: Python
        source: |-
          import os
          import payzu_pix

          config = payzu_pix.Configuration(
              host='https://api.pix.payzu.com.br/v1',
              access_token=os.environ['PAYZU_TOKEN'],
          )

          with payzu_pix.ApiClient(config) as client:
              api = payzu_pix.PixOperationsApi(client)
              request = payzu_pix.PostPixRequest(
                  amount=10.9,
                  callback_url='https://webhook.cool/',
                  generated_name='John Doe',
                  generated_email='john.doe@example.com',
                  generated_document='12345678901',
                  expires_in=600,
                  client_reference='order_12345',
                  virtual_account='loja-centro-01',
              )
              charge = api.post_pix(request)
              print(charge.id, charge.status, charge.qr_code_text)
  /pix/key:
    get:
      description: Consulta o DICT (Diretório de Identificadores de Contas Transacionais)
        para obter informações sobre uma chave Pix antes de enviar um pagamento. Retorna
        os dados do titular da chave e a instituição financeira associada.
      operationId: get_pix_key
      parameters:
      - description: "A chave Pix a consultar (CPF, CNPJ, email, telefone ou EVP)."
        example: example@payzu.com.br
        explode: true
        in: query
        name: pixKey
        required: true
        schema:
          maxLength: 77
          minLength: 1
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                pj:
                  summary: Pessoa Jurídica (PJ)
                  value:
                    pixKey: 5c8999e2-6b29-468b-b4e9-04d4872b1bc4
                    document: '**.345.678/****-**'
                    name: EMPRESA EXEMPLO LTDA
                    branch: '****'
                    accountNumber: '*******'
                    personType: PJ
                    accountType: CACC
                    institutionIspb: "12345678"
                    institutionCode: "001"
                    institutionName: BANCO EXEMPLO S.A.
                pf:
                  summary: Pessoa Física (PF)
                  value:
                    pixKey: "12345678901"
                    document: '***.456.789-**'
                    name: João da Silva
                    branch: '****'
                    accountNumber: '********'
                    personType: PF
                    accountType: TRAN
                    institutionIspb: "87654321"
                    institutionCode: "260"
                    institutionName: BANCO FICTICIO S.A.
              schema:
                $ref: "#/components/schemas/PixKeyInfo"
          description: Chave Pix encontrada
        "400":
          content:
            application/json:
              examples:
                PZV001:
                  summary: Dados inválidos. Verifique os campos informados.
                  value:
