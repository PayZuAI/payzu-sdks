        amount: 0.8008281904610115
        method: PIX
        cancellationReason: cancellationReason
        receiverName: receiverName
        refundReason: CUSTOMER_REQUEST
        generatedDocument: generatedDocument
        withdrawPixKey: withdrawPixKey
