openapi: 3.1.0
info:
  contact:
    name: Suporte PayZu
    url: https://suporte.payzu.com.br
  description: |-
    API REST para operações Pix na plataforma PayZu, depósitos, saques, transferências internas, infrações, relatórios e inspeção de callback. Todos os valores estão em BRL (reais), salvo indicação explícita. A autenticação usa um token Bearer emitido durante o onboarding.

    ## SDKs oficiais

    - Node.js: `npm install @payzu/pix`
    - Python: `pip install payzu-pix`
    - PHP: `composer require payzu/pix`
    - Ruby: `gem install payzu-pix`
    - Java: `br.com.payzu:payzu-pix` (Maven Central)
    - Go: `go get github.com/PayZuAI/payzu-sdks/go/v3`

    Repo: https://github.com/PayZuAI/payzu-sdks
  title: PayZu Pix API
  version: 1.8.0
servers:
- description: Produção
  url: https://api.pix.payzu.com.br/v1
- description: Sandbox
  url: https://pix.sandbox.payzu.dev/v1
tags:
- description: Crie e gerencie cobranças Pix (depósitos)
  name: Pix Operations
- description: "Devolução de Pix recebidos, total ou parcial"
  name: Refunds
- description: Envie dinheiro via Pix (cash out) por chave Pix ou QR Code
  name: Withdrawals
- description: Consulte chaves Pix no diretório DICT e decodifique QR Codes Pix antes
    de pagar
  name: Keys and DICT
- description: "Transfira fundos entre contas PayZu (gratuito, instantâneo)"
  name: Internal Transfer
- description: "Perfil da conta, saldo"
  name: Account
- description: "Histórico de transações, relatórios, extratos bancários e depósitos\
    \ pendentes"
  name: Reports
- description: Inspeção e reenvio de callback de webhook
  name: Callbacks
- description: Cadastre e gerencie os endpoints de webhook que recebem as notificações
    de transação
  name: Webhooks
- description: "Gerencie infrações Pix (disputas, denúncias de fraude) e envie defesas"
  name: Infractions
- description: CNPJs e chaves Pix autorizados na conta.
  name: Allowlist
- description: "Avisos que a PayZu envia ao seu endpoint, um por evento."
  name: Webhook Events
paths:
  /pix:
    get:
      description: "Obtém o status e os detalhes mais recentes de uma transação da\
        \ conta. Informe pelo menos um dentre `id`, `clientReference` ou `endToEndId`\
        \ (`virtualAccount` também é aceito). Ao informar mais de um parâmetro, todos\
        \ são combinados como filtros (AND)."
      operationId: get_pix
      parameters:
      - description: ID da transação.
        example: PAYZU20260811R4TZ8WD1NC000000
        explode: true
        in: query
        name: id
        required: false
        schema:
          type: string
        style: form
      - description: Referência externa fornecida na criação da cobrança.
        example: order_12345
        explode: true
        in: query
        name: clientReference
        required: false
        schema:
          maxLength: 64
          type: string
        style: form
      - description: ID end-to-end do Pix.
        example: E00000000202508172159kZ8dQ2mNb1x
        explode: true
        in: query
        name: endToEndId
        required: false
        schema:
          type: string
        style: form
      - description: Subconta usada na criação.
        example: loja-centro-01
        explode: true
        in: query
        name: virtualAccount
        required: false
        schema:
          maxLength: 50
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                pending:
                  summary: Pagamento pendente
                  value:
                    id: PAYZU20260811R4TZ8WD1NC000000
                    status: PENDING
                    amount: 10
                    type: DEPOSIT
                    qrCodeText: 00020126860014br.gov.bcb.pix2564qrcode.payzu.com.br/dynamic/11111111-2222-3333-4444-5555555555555204000053039865802BR5909PAYZUPLUS6009SAO
