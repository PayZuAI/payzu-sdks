                  summary: Não foi possível gerar o depósito junto à instituição financeira.
                    Tente novam...
                  value:
                    status: ERROR
                    error: Failed Dependency
                    errorCode: PZD100
                    message: Não foi possível gerar o depósito junto à instituição
                      financeira. Tente novamente.
                    statusCode: 424
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZD103:
                  summary: O tempo limite de processamento do depósito foi atingido.
                    Tente novamente.
                  value:
                    status: ERROR
                    error: Failed Dependency
                    errorCode: PZD103
                    message: O tempo limite de processamento do depósito foi atingido.
                      Tente novamente.
                    statusCode: 424
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZD500:
                  summary: Nenhuma instituição financeira disponível no momento. Tente
                    novamente em inst...
