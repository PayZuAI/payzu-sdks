  /user/dict:
    get:
      description: Resolves a Pix key (DICT) to the holder details before paying.
        Requires WITHDRAW scope.
      externalDocs:
        description: DICT lookup
        url: /docs/pix-processamento/best-practices/dict
      operationId: get_user_dict
      parameters:
      - description: "Pix key to look up (CPF, CNPJ, email, phone or EVP)."
        example: john.doe@example.com
        explode: true
        in: query
        name: key
        required: true
        schema:
          maxLength: 77
          minLength: 1
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                key:
                  value:
                    pixKey: "+5511999998888"
                    name: Fulano de Tal
                    document: '***.456.789-**'
                    personType: PF
                    accountType: CACC
                    institutionIspb: "12345678"
                    institutionName: Banco X
              schema:
                $ref: "#/components/schemas/DictConsultResponse"
          description: Key holder details.
        "400":
          content:
