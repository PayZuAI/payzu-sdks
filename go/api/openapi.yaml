                    errorCode: PZA203
                    message: Acesso não permitido a partir do endereço de IP 203.0.113.10.
                    statusCode: 403
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZA205:
                  summary: Conta com token de saque exige IP cadastrado na whitelist.
                    Cadastre o IP de o...
                  value:
                    status: ERROR
                    error: Forbidden
                    errorCode: PZA205
                    message: Conta com token de saque exige IP cadastrado na whitelist.
                      Cadastre o IP de origem (203.0.113.10) antes de operar.
                    statusCode: 403
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: ""
        "404":
          content:
            application/json:
              examples:
                PZC310:
                  summary: Transação não encontrada.
                  value:
                    status: ERROR
                    error: Not Found
                    errorCode: PZC310
                    message: Transação não encontrada.
                    statusCode: 404
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Recurso não encontrado
      security:
      - BearerAuth: []
      summary: Recuperar Cobrança
      tags:
      - Pix Operations
      x-codeSamples:
      - id: curl
        lang: bash
        label: cURL
        source: |-
          curl --request GET \
            --url 'https://api.pix.payzu.com.br/v1/pix?id=PAYZU20260811R4TZ8WD1NC000000' \
            --header "Authorization: Bearer $PAYZU_TOKEN"
      - id: js
        lang: js
        label: Node.js
        source: |-
          const url = 'https://api.pix.payzu.com.br/v1/pix?id=PAYZU20260811R4TZ8WD1NC000000';

          const response = await fetch(url, {
            method: 'GET',
            headers: {
              Authorization: `Bearer ${process.env.PAYZU_TOKEN}`,
            },
          });

          const data = await response.json();
          console.log(data);
      - id: python
        lang: python
        label: Python
        source: |-
          import os
          import requests

          response = requests.get(
              'https://api.pix.payzu.com.br/v1/pix?id=PAYZU20260811R4TZ8WD1NC000000',
              headers={
                  'Authorization': f'Bearer {os.environ["PAYZU_TOKEN"]}',
              },
          )

          print(response.json())
