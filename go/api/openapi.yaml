                    error: Forbidden
                    errorCode: PZK400
                    message: Pix key lookup not enabled for the user.
                    statusCode: 403
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZA200:
                  summary: Forbidden
                  value:
                    status: ERROR
                    error: Forbidden
                    errorCode: PZA200
                    message: Forbidden
                    statusCode: 403
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Operation not allowed
        "404":
          content:
            application/json:
              examples:
                PZK300:
                  summary: Pix key not found.
                  value:
                    status: ERROR
                    error: Not Found
