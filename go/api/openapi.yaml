          description: "Quem abriu: `DEBITED_PARTICIPANT`, a instituição da conta\
            \ debitada, ou `CREDITED_PARTICIPANT`, a da conta creditada."
          enum:
          - DEBITED_PARTICIPANT
          - CREDITED_PARTICIPANT
          type: string
        analysisResult:
          description: "Resultado da análise: `AGREED`, a contestação procede e a\
            \ devolução ao pagador segue, avisada em `TRANSACTION_REFUNDED`; `DISAGREED`,\
            \ a contestação não procede."
          enum:
          - AGREED
          - DISAGREED
          - null
          nullable: true
          type: string
        analysisDetails:
          description: "Texto da decisão, quando a instituição envia."
          nullable: true
          type: string
        reportedAt:
          description: Abertura da infração.
          format: date-time
          type: string
        expiresAt:
          description: Prazo final para enviar a defesa.
          format: date-time
          nullable: true
          type: string
        createdAt:
          description: Registro da infração na PayZu.
          format: date-time
          type: string
        updatedAt:
          description: "Última mudança da infração. Com `infraction.id`, serve para\
            \ deduplicar e ordenar."
          format: date-time
          type: string
      required:
      - analysisDetails
      - analysisResult
      - createdAt
      - expiresAt
      - id
      - protocol
      - reportDetails
      - reportedAt
      - reportedBy
      - status
      - type
      - updatedAt
