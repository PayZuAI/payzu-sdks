          - WAITING_PSP
          - OPEN
          - ACKNOWLEDGED
          - DEFENDED
          - ANSWERED
          - WAITING_ADJUSTMENTS
          - CLOSED
          - CANCELLED
          type: string
        type:
          description: Tipo informado na abertura.
          enum:
          - REFUND_REQUEST
          - FRAUD
          - REFUND_CANCELLED
