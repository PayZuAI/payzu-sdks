            "createdAtTo": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "webhookIds": [
              "cm3w7k1t40000q8f2r5b9x3ad"
            ],
            "transactionIds": [
              "PAYZU20260814T6NX1CV9MK000000"
            ],
            "transactionTypes": [
              "DEPOSIT"
            ],
            "transactionStatus": [
              "PENDING"
            ],
            "transactionEndToEndIds": [
              "E12345678202608121200ABCDEFGHIJK"
            ]
          }
          EOF
      - id: js
        lang: js
        label: Node.js
        source: |-
          const url = 'https://api.pix.payzu.com.br/v1/user/callbacks/resend/webhook';

          // início em até 30 dias atrás e período de até 7 dias; aqui, de 00:00 UTC de hoje até agora
          const createdAtTo = new Date().toISOString();
          const createdAtFrom = `${createdAtTo.slice(0, 10)}T00:00:00Z`;

          const response = await fetch(url, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${process.env.PAYZU_TOKEN}`,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              createdAtFrom,
              createdAtTo,
              webhookIds: [
                'cm3w7k1t40000q8f2r5b9x3ad'
              ],
              transactionIds: [
                'PAYZU20260814T6NX1CV9MK000000'
              ],
              transactionTypes: [
                'DEPOSIT'
              ],
              transactionStatus: [
                'PENDING'
              ],
              transactionEndToEndIds: [
                'E12345678202608121200ABCDEFGHIJK'
              ]
            }),
          });

          const data = await response.json();
          console.log(data);
      - id: python
        lang: python
        label: Python
        source: |-
          import os
          from datetime import datetime, timezone

          import requests

          # início em até 30 dias atrás e período de até 7 dias; aqui, de 00:00 UTC de hoje até agora
          now = datetime.now(timezone.utc)

          response = requests.post(
              'https://api.pix.payzu.com.br/v1/user/callbacks/resend/webhook',
              headers={
                  'Authorization': f'Bearer {os.environ["PAYZU_TOKEN"]}',
                  'Content-Type': 'application/json',
              },
              json={
                  'createdAtFrom': now.strftime('%Y-%m-%dT00:00:00Z'),
                  'createdAtTo': now.strftime('%Y-%m-%dT%H:%M:%SZ'),
                  'webhookIds': [
                      'cm3w7k1t40000q8f2r5b9x3ad'
                  ],
                  'transactionIds': [
                      'PAYZU20260814T6NX1CV9MK000000'
                  ],
                  'transactionTypes': [
                      'DEPOSIT'
                  ],
                  'transactionStatus': [
                      'PENDING'
                  ],
                  'transactionEndToEndIds': [
                      'E12345678202608121200ABCDEFGHIJK'
                  ]
              },
          )

          print(response.json())
