openapi: 3.1.0
info:
  contact:
    name: Suporte PayZu
    url: https://suporte.payzu.com.br
  description: |
    REST API for Pix operations on the PayZu platform, deposits, withdrawals, internal transfers, infractions, reports, and callback inspection. All amounts are in BRL (reais) unless explicitly noted. Authentication uses a Bearer token issued during onboarding.

    ## SDKs oficiais

    - Node.js: `npm install payzu-pix`
    - Python: `pip install payzu-pix`
    - PHP: `composer require payzu/pix`
    - Ruby: `gem install payzu-pix`
    - Java: `br.com.payzu:payzu-pix` (Maven Central)
    - Go: `go get github.com/PayZuAI/payzu-sdks/go`

    Repo: https://github.com/PayZuAI/payzu-sdks
  title: PayZu Pix API
  version: 1.8.0
externalDocs:
  description: Complete documentation
  url: https://docs.payzu.com.br/docs/pix-processamento
servers:
- description: Production
  url: https://api.payzu.processamento.com/v1
tags:
- description: Create and manage Pix charges (deposits)
  name: Pix Operations
- description: "Refund received Pix charges, full or partial"
  name: Refunds
- description: Send money via Pix (cash out) by Pix key or QR Code
  name: Withdrawals
- description: Look up Pix keys in the DICT directory and decode Pix QR Codes before
    paying
  name: Keys and DICT
- description: "Transfer funds between PayZu accounts (free, instant)"
  name: Internal Transfer
- description: "Account profile, balance"
  name: Account
- description: "Transaction history, reports, bank statements, and pending deposits"
  name: Reports
- description: Webhook callback inspection and re-trigger
  name: Callbacks
- description: Register and manage webhook endpoints that receive transaction notifications
  name: Webhooks
- description: "Manage Pix infractions (disputes, fraud reports) and submit defenses"
  name: Infractions
paths:
  /pix:
    get:
      description: |-
        Get the latest status and details of a transaction of the account. Provide at least one of `id`, `clientReference`, or `endToEndId` (`virtualAccount` is also accepted). When more than one parameter is provided, they are combined as filters (AND).

        Token permission: `DEPOSIT`.
      externalDocs:
        description: Receber pagamento Pix
        url: /docs/pix-processamento/tutoriais/receive-pix
      operationId: get_pix
      parameters:
      - description: Transaction ID.
        example: PAYZU20260811R4TZ8WD1NC000000
        explode: true
        in: query
        name: id
        required: false
        schema:
          type: string
        style: form
      - description: External reference provided when creating the charge.
        example: order_12345
        explode: true
        in: query
        name: clientReference
        required: false
        schema:
          maxLength: 64
          type: string
        style: form
      - description: Pix end-to-end ID.
        example: E00000000202508172159kZ8dQ2mNb1x
        explode: true
        in: query
        name: endToEndId
        required: false
        schema:
          type: string
        style: form
      - description: Virtual sub-account (up to 50 characters) used at creation. Accepted
          as an alternative lookup key.
        example: loja-centro-01
        explode: true
        in: query
        name: virtualAccount
        required: false
        schema:
          maxLength: 50
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                pending:
                  summary: Pending payment
                  value:
                    id: PAYZU20260811R4TZ8WD1NC000000
                    status: PENDING
                    amount: 10
                    type: DEPOSIT
                    qrCodeText: 00020126870014br.gov.bcb.pix2565qrcode.payzu.com.br/dynamic/11111111-2222-3333-4444-5555555555555204000053039865802BR5908PAYZUPLUS6009SAO
                      PAULO62070503***63047EE4
                    qrCodeBase64: iVBORw0KGgoAAAANSUhEUgAAAZAAAAGQCAYAAAC...
                    qrCodeUrl: https://pix.payzu.com.br/v1/pix/qr-code/PAYZU20260811R4TZ8WD1NC000000
                    generatedName: John Doe
                    generatedDocument: "12345678901"
                    generatedEmail: john.doe@example.com
                    serviceFeeCharged: 0.075
                    payerName: null
                    payerDocument: null
                    payerInstitutionIspb: null
                    payerInstitutionName: null
                    payerAccountNumber: null
                    receiverName: null
                    receiverDocument: null
                    receiverInstitutionIspb: null
                    receiverInstitutionName: null
                    receiverAccountNumber: "000000"
                    endToEndId: null
                    createdAt: 2026-08-11T21:59:11.579Z
                    updatedAt: 2026-08-11T21:59:11.579Z
                    paidAt: null
                    withdrawPixKey: null
                    withdrawPixType: null
                    clientReference: order_12345
                    refundEndToEndId: null
                    refundAmount: null
                    refundStatus: null
                    refundReason: null
                    refundDescription: null
                    refundedAt: null
                    cancellationReason: null
                completed:
                  summary: Completed payment
                  value:
                    id: PAYZU20260811R4TZ8WD1NC000000
                    status: COMPLETED
                    amount: 10
                    type: DEPOSIT
                    qrCodeText: null
                    qrCodeBase64: null
                    qrCodeUrl: null
                    generatedName: John Doe
                    generatedDocument: "12345678901"
                    generatedEmail: john.doe@example.com
                    serviceFeeCharged: 0.075
                    payerName: John Doe
                    payerDocument: "12345678901"
                    payerInstitutionIspb: "12345678"
                    payerInstitutionName: Banco X
                    payerAccountNumber: null
                    receiverName: PayZu Pagamentos Ltda
                    receiverDocument: 12.345.678/0001-00
                    receiverInstitutionIspb: "23066240"
                    receiverInstitutionName: PAYZU IP LTDA.
                    receiverAccountNumber: "000000"
                    endToEndId: E123456782026081122013B13DMS72H9
                    createdAt: 2026-08-11T21:59:11.579Z
                    updatedAt: 2026-08-11T22:01:30.123Z
                    paidAt: 2026-08-11T22:01:30.123Z
                    withdrawPixKey: null
                    withdrawPixType: null
                    clientReference: order_12345
                    refundEndToEndId: null
                    refundAmount: null
                    refundStatus: null
                    refundReason: null
                    refundDescription: null
                    refundedAt: null
                    cancellationReason: null
              schema:
                $ref: "#/components/schemas/Transaction"
          description: Current transaction state
        "400":
          content:
            application/json:
              examples:
                PZV001:
                  summary: Invalid data. Check the fields provided.
                  value:
                    status: ERROR
                    error: Bad Request
                    errorCode: PZV001
                    message: Invalid data. Check the fields provided.
                    statusCode: 400
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                    details:
                    - field: ""
                      message: "You must provide 'id', 'clientReference', 'endToEndId'\
                        \ or 'virtualAccount'"
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Bad Request, payload or query string failed validation"
        "401":
          content:
            application/json:
              examples:
                PZA100:
                  summary: Unauthorized
                  value:
                    status: ERROR
                    error: Unauthorized
                    errorCode: PZA100
                    message: Unauthorized
                    statusCode: 401
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Missing or invalid Bearer token
        "403":
          content:
            application/json:
              examples:
                PZA200:
                  summary: Forbidden
                  value:
                    status: ERROR
                    error: Forbidden
                    errorCode: PZA200
                    message: Forbidden
                    statusCode: 403
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Operation not allowed, including a token without the required\
            \ permission (PZA200)"
        "404":
          content:
            application/json:
              examples:
                PZC310:
                  summary: Transaction not found.
                  value:
                    status: ERROR
                    error: Not Found
                    errorCode: PZC310
                    message: Transaction not found.
                    statusCode: 404
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
      security:
      - BearerAuth: []
      summary: Retrieve Charge
      tags:
      - Pix Operations
      x-codeSamples:
      - id: curl
        lang: bash
        label: cURL
        source: |-
          curl --request GET \
            --url 'https://api.payzu.processamento.com/v1/pix' \
            --header 'Authorization: Bearer $PAYZU_TOKEN'
      - id: js
        lang: js
        label: Node.js
        source: |-
          const url = 'https://api.payzu.processamento.com/v1/pix';

          const response = await fetch(url, {
            method: 'GET',
            headers: {
              Authorization: `Bearer ${process.env.PAYZU_TOKEN}`,
            },
          });

          const data = await response.json();
          console.log(data);
      - id: python
        lang: python
        label: Python
        source: |-
          import os
          import requests

          response = requests.get(
              'https://api.payzu.processamento.com/v1/pix',
              headers={
                  'Authorization': f'Bearer {os.environ["PAYZU_TOKEN"]}',
              },
          )

          print(response.json())
    post:
      description: |-
        Create a new Pix **deposit** (charge). Returns QR Code and transaction details.

        Token permission: `DEPOSIT`.
      externalDocs:
        description: Receber pagamento Pix
        url: /docs/pix-processamento/tutoriais/receive-pix
      operationId: post_pix
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostPixRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                created:
                  summary: Created (PENDING)
                  value:
                    id: PAYZU20260811R4TZ8WD1NC000000
                    status: PENDING
                    amount: 10
                    type: DEPOSIT
                    qrCodeText: 00020126870014br.gov.bcb.pix2565qrcode.payzu.com.br/dynamic/11111111-2222-3333-4444-5555555555555204000053039865802BR5908PAYZUPLUS6009SAO
                      PAULO62070503***63047EE4
                    qrCodeBase64: iVBORw0KGgoAAAANSUhEUgAAAZAAAAGQCAYAAAC...
                    qrCodeUrl: https://pix.payzu.com.br/v1/pix/qr-code/PAYZU20260811R4TZ8WD1NC000000
                    generatedName: John Doe
                    generatedDocument: "12345678901"
                    generatedEmail: john.doe@example.com
                    serviceFeeCharged: 0.075
                    payerName: null
                    payerDocument: null
                    payerInstitutionIspb: null
                    payerInstitutionName: null
                    payerAccountNumber: null
                    receiverName: null
                    receiverDocument: null
                    receiverInstitutionIspb: null
                    receiverInstitutionName: null
                    receiverAccountNumber: "000000"
                    endToEndId: null
                    createdAt: 2026-08-11T21:59:11.579Z
                    updatedAt: 2026-08-11T21:59:11.579Z
                    paidAt: null
                    withdrawPixKey: null
                    withdrawPixType: null
                    clientReference: order_12345
                    refundEndToEndId: null
                    refundAmount: null
                    refundStatus: null
                    refundReason: null
                    refundDescription: null
                    refundedAt: null
                    cancellationReason: null
              schema:
                $ref: "#/components/schemas/Transaction"
          description: Charge created
        "400":
          content:
            application/json:
              examples:
                PZV001:
                  summary: Invalid data. Check the fields provided.
                  value:
                    status: ERROR
                    error: Bad Request
                    errorCode: PZV001
                    message: Invalid data. Check the fields provided.
                    statusCode: 400
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                    details:
                    - field: amount
                      message: "Too small: expected number to be >=1"
                PZD600:
                  summary: The minimum deposit amount is R$ 1.00.
                  value:
                    status: ERROR
                    error: Bad Request
                    errorCode: PZD600
                    message: The minimum deposit amount is R$ 1.00.
                    statusCode: 400
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZD601:
                  summary: "The maximum deposit amount is R$ 50,000.00."
                  value:
                    status: ERROR
                    error: Bad Request
                    errorCode: PZD601
                    message: "The maximum deposit amount is R$ 50,000.00."
                    statusCode: 400
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZD602:
                  summary: "For deposits above {limite} the document is required."
                  value:
                    status: ERROR
                    error: Bad Request
                    errorCode: PZD602
                    message: "For deposits above {limite} the document is required."
                    statusCode: 400
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Bad Request, payload or query string failed validation"
        "401":
          content:
            application/json:
              examples:
                PZA100:
                  summary: Unauthorized
                  value:
                    status: ERROR
                    error: Unauthorized
                    errorCode: PZA100
                    message: Unauthorized
                    statusCode: 401
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Missing or invalid Bearer token
        "403":
          content:
            application/json:
              examples:
                PZA200:
                  summary: Forbidden
                  value:
                    status: ERROR
                    error: Forbidden
                    errorCode: PZA200
                    message: Forbidden
                    statusCode: 403
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZA206:
                  summary: Account awaiting contract signature. Sign the contract
                    sent to the legal repre...
                  value:
                    status: ERROR
                    error: Forbidden
                    errorCode: PZA206
                    message: Account awaiting contract signature. Sign the contract
                      sent to the legal representative to release operations.
                    statusCode: 403
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: "Operation not allowed, including a token without the required\
            \ permission (PZA200)"
        "422":
          content:
            application/json:
              examples:
                PZD200:
                  summary: Deposit not allowed for this account.
                  value:
                    status: ERROR
                    error: Unprocessable Entity
                    errorCode: PZD200
                    message: Deposit not allowed for this account.
                    statusCode: 422
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Operation refused
        "424":
          content:
            application/json:
              examples:
                PZD100:
                  summary: The deposit could not be created at the financial institution.
                    Try again...
                  value:
                    status: ERROR
                    error: Failed Dependency
                    errorCode: PZD100
                    message: Could not generate the deposit with the financial institution.
                      Try again.
                    statusCode: 424
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZD103:
                  summary: The deposit processing timeout was reached. Try again.
                  value:
                    status: ERROR
                    error: Failed Dependency
                    errorCode: PZD103
                    message: The deposit processing timeout was reached. Try again.
                    statusCode: 424
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZD500:
                  summary: No financial institution available at the moment. Try again
                    shortly...
                  value:
                    status: ERROR
                    error: Failed Dependency
                    errorCode: PZD500
                    message: No financial institution available at the moment. Try
                      again shortly.
                    statusCode: 424
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                    retryAfterSeconds: 5
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Failure at the financial institution
      security:
      - BearerAuth: []
      summary: Create Charge (Pix deposit)
      tags:
      - Pix Operations
      x-codeSamples:
      - id: curl
        lang: bash
        label: cURL
        source: |-
          curl --request POST \
            --url 'https://api.payzu.processamento.com/v1/pix' \
            --header 'Authorization: Bearer $PAYZU_TOKEN' \
            --header 'Content-Type: application/json' \
            --data '{
            "amount": 10.9,
            "callbackUrl": "https://webhook.cool/",
            "generatedName": "John Doe",
            "generatedEmail": "john.doe@example.com",
            "generatedDocument": "12345678901",
            "expiresIn": 600,
            "clientReference": "order_12345",
            "virtualAccount": "loja-centro-01"
          }'
      - id: js
        lang: js
        label: Node.js
        source: |-
          import { PayZu } from 'payzu-pix';

          const payzu = new PayZu({ token: process.env.PAYZU_TOKEN });

          const charge = await payzu.pix.create({
            amount: 10.9,
            callbackUrl: 'https://webhook.cool/',
            generatedName: 'John Doe',
            generatedEmail: 'john.doe@example.com',
            generatedDocument: '12345678901',
            expiresIn: 600,
            clientReference: 'order_12345',
            virtualAccount: 'loja-centro-01'
          });

          console.log(charge.id, charge.status, charge.qrCodeText);
      - id: python
        lang: python
        label: Python
        source: |-
          import os
          import payzu_pix

          config = payzu_pix.Configuration(
              host='https://api.payzu.processamento.com/v1',
              access_token=os.environ['PAYZU_TOKEN'],
          )

          with payzu_pix.ApiClient(config) as client:
              api = payzu_pix.PixOperationsApi(client)
              request = payzu_pix.PostPixRequest(
                  amount=10.9,
                  callback_url='https://webhook.cool/',
                  generated_name='John Doe',
                  generated_email='john.doe@example.com',
                  generated_document='12345678901',
                  expires_in=600,
                  client_reference='order_12345',
                  virtual_account='loja-centro-01',
              )
              charge = api.post_pix(request)
              print(charge.id, charge.status, charge.qr_code_text)
  /pix/key:
    get:
      description: |-
        Query the DICT (Diretório de Identificadores de Contas Transacionais) to retrieve information about a Pix key before sending a payment. Returns the key owner's details and associated financial institution.

        Token permission: `DEPOSIT` or `WITHDRAW`.
      externalDocs:
        description: Receber pagamento Pix
        url: /docs/pix-processamento/tutoriais/receive-pix
      operationId: get_pix_key
      parameters:
      - description: "The Pix key to lookup (CPF, CNPJ, email, phone, or EVP)."
        example: example@payzu.com.br
        explode: true
        in: query
        name: pixKey
        required: true
        schema:
          maxLength: 77
          minLength: 1
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                pj:
                  summary: Legal Entity (PJ)
                  value:
                    pixKey: 5c8999e2-6b29-468b-b4e9-04d4872b1bc4
                    document: '**.345.678/****-**'
                    name: EMPRESA EXEMPLO LTDA
                    branch: '****'
                    accountNumber: '*******'
                    personType: PJ
                    accountType: CACC
                    institutionIspb: "12345678"
                    institutionCode: "001"
                    institutionName: BANCO EXEMPLO S.A.
                pf:
                  summary: Individual (PF)
                  value:
                    pixKey: "12345678901"
                    document: '***.456.789-**'
                    name: João da Silva
                    branch: '****'
                    accountNumber: '********'
                    personType: PF
                    accountType: TRAN
                    institutionIspb: "87654321"
                    institutionCode: "260"
                    institutionName: BANCO FICTICIO S.A.
              schema:
                $ref: "#/components/schemas/PixKeyInfo"
          description: Pix key information retrieved successfully
        "400":
          content:
            application/json:
              examples:
                PZV001:
                  summary: Invalid data. Check the fields provided.
                  value:
                    status: ERROR
                    error: Bad Request
                    errorCode: PZV001
                    message: Invalid data. Check the fields provided.
                    statusCode: 400
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                    details:
                    - field: pixKey
                      message: "Invalid Pix key. Accepted formats: CPF, CNPJ, email,\
                        \ phone (+5511999999999) or EVP (UUID)"
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid Pix key format
        "401":
          content:
            application/json:
              examples:
                PZA100:
                  summary: Unauthorized
                  value:
                    status: ERROR
                    error: Unauthorized
                    errorCode: PZA100
                    message: Unauthorized
                    statusCode: 401
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failure
        "403":
          content:
            application/json:
              examples:
                PZK400:
                  summary: Pix key lookup not enabled for the user.
                  value:
                    status: ERROR
                    error: Forbidden
                    errorCode: PZK400
                    message: Pix key lookup not enabled for the user.
                    statusCode: 403
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZA200:
                  summary: Forbidden
                  value:
                    status: ERROR
                    error: Forbidden
                    errorCode: PZA200
                    message: Forbidden
                    statusCode: 403
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Operation not allowed
        "404":
          content:
            application/json:
              examples:
                PZK300:
                  summary: Pix key not found.
                  value:
                    status: ERROR
                    error: Not Found
                    errorCode: PZK300
                    message: Pix key not found.
                    statusCode: 404
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Pix key not found in DICT
        "422":
          content:
            application/json:
              examples:
                PZK200:
                  summary: Invalid Pix key.
                  value:
                    status: ERROR
                    error: Unprocessable Entity
                    errorCode: PZK200
                    message: Invalid Pix key.
                    statusCode: 422
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Operation refused
        "424":
          content:
            application/json:
              examples:
                PZI110:
                  summary: Communication error with the financial institution.
                  value:
                    status: ERROR
                    error: Failed Dependency
                    errorCode: PZI110
                    message: Communication error with the financial institution.
                    statusCode: 424
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZI111:
                  summary: The financial institution took too long to respond. Try
                    again.
                  value:
                    status: ERROR
                    error: Failed Dependency
                    errorCode: PZI111
                    message: The financial institution took too long to respond. Try
                      again.
                    statusCode: 424
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Failure at the financial institution
        "429":
          content:
            application/json:
              examples:
                PZG429:
                  summary: Query limit reached. Try again shortly. Try again in 30s.
                  value:
                    status: ERROR
                    error: Too Many Requests
                    errorCode: PZG429
                    message: Query limit reached. Try again shortly. Try again in
                      30s.
                    statusCode: 429
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                    retryAfterSeconds: 30
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Rate limit exceeded
        "500":
          content:
            application/json:
              examples:
                PZI101:
                  summary: Operation not supported for this financial institution.
                  value:
                    status: ERROR
                    error: Internal Server Error
                    errorCode: PZI101
                    message: Operation not supported for this financial institution.
                    statusCode: 500
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Internal error
      security:
      - BearerAuth: []
      summary: Pix key lookup (DICT)
      tags:
      - Keys and DICT
      x-codeSamples:
      - id: curl
        lang: bash
        label: cURL
        source: |-
          curl --request GET \
            --url 'https://api.payzu.processamento.com/v1/pix/key?pixKey=example%40payzu.com.br' \
            --header 'Authorization: Bearer $PAYZU_TOKEN'
      - id: js
        lang: js
        label: Node.js
        source: |-
          const url = 'https://api.payzu.processamento.com/v1/pix/key?pixKey=example%40payzu.com.br';

          const response = await fetch(url, {
            method: 'GET',
            headers: {
              Authorization: `Bearer ${process.env.PAYZU_TOKEN}`,
            },
          });

          const data = await response.json();
          console.log(data);
      - id: python
        lang: python
        label: Python
        source: |-
          import os
          import requests

