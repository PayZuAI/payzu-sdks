      tags:
      - Pix Operations
      x-codeSamples:
      - id: curl
        lang: bash
        label: cURL
        source: |-
          http_code=$(curl --request GET \
              --url 'https://api.pix.payzu.com.br/v1/proof/PAYZU20260814T6NX1CV9MK000000' \
              --header "Authorization: Bearer $PAYZU_TOKEN" \
              --output resposta \
              --write-out '%{http_code}')

          if [ "$http_code" = 200 ]; then
            mv resposta comprovante.pdf
          else
            cat resposta
          fi
      - id: js
        lang: js
        label: Node.js
        source: |-
          import { writeFile } from 'node:fs/promises';

          const url = 'https://api.pix.payzu.com.br/v1/proof/PAYZU20260814T6NX1CV9MK000000';

          const response = await fetch(url, {
            method: 'GET',
            headers: {
              Authorization: `Bearer ${process.env.PAYZU_TOKEN}`,
            },
          });

          if (response.ok) {
            await writeFile('comprovante.pdf', Buffer.from(await response.arrayBuffer()));
          } else {
            console.error(await response.json());
          }
      - id: python
        lang: python
        label: Python
        source: |-
          import os
          import requests

          response = requests.get(
              'https://api.pix.payzu.com.br/v1/proof/PAYZU20260814T6NX1CV9MK000000',
              headers={
                  'Authorization': f'Bearer {os.environ["PAYZU_TOKEN"]}',
              },
          )

          if response.ok:
              with open('comprovante.pdf', 'wb') as file:
                  file.write(response.content)
          else:
              print(response.json())
