        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostPixQrcodeReadRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              examples:
                dynamic:
                  summary: Dynamic QR Code
                  value:
                    qrCodeType: DYNAMIC
                    name: LOJA EXEMPLO LTDA
                    document: "12345678000199"
                    amount: 10
                    originalAmount: 10
                    txid: c5886b83f0254d0dbfc3900f72d5a8d1
                    additionalInfo: null
                    expiresIn: 1799
                    createdAt: 2026-02-03T22:59:36.138
                static:
                  summary: Static QR Code
                  value:
                    qrCodeType: STATIC
                    name: MARIA SANTOS
                    document: "98765432100"
                    amount: 1
                    originalAmount: 1
                    txid: QRTEST20251103083119867
                    additionalInfo: null
                    expiresIn: 0
                    createdAt: null
              schema:
                $ref: "#/components/schemas/QRCodeReadResponse"
          description: QR Code decoded successfully
        "400":
          content:
            application/json:
              examples:
                PZV001:
                  summary: Invalid data. Check the fields provided.
                  value:
                    status: ERROR
                    error: Bad Request
                    errorCode: PZV001
                    message: Invalid data. Check the fields provided.
                    statusCode: 400
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                    details:
                    - field: emv
                      message: "Too small: expected string to have >=1 characters"
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Invalid QR Code format
        "401":
          content:
            application/json:
              examples:
                PZA100:
                  summary: Unauthorized
                  value:
                    status: ERROR
                    error: Unauthorized
                    errorCode: PZA100
                    message: Unauthorized
                    statusCode: 401
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Authentication failure
        "403":
          content:
            application/json:
              examples:
                PZK401:
                  summary: QR Code reading not enabled for the user.
                  value:
                    status: ERROR
                    error: Forbidden
                    errorCode: PZK401
                    message: QR Code reading not enabled for the user.
                    statusCode: 403
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZA200:
                  summary: Forbidden
                  value:
                    status: ERROR
                    error: Forbidden
                    errorCode: PZA200
                    message: Forbidden
                    statusCode: 403
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Operation not allowed
        "424":
          content:
            application/json:
              examples:
                PZI110:
                  summary: Communication error with the financial institution.
                  value:
                    status: ERROR
                    error: Failed Dependency
                    errorCode: PZI110
                    message: Communication error with the financial institution.
                    statusCode: 424
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Failure at the financial institution
        "429":
          content:
            application/json:
              examples:
