          - cnpj
          - email
          - phone
          - evp
          - null
          nullable: true
          type: string
        receiverName:
          description: Name of the holder of the receiving account.
          nullable: true
          type: string
        receiverDocument:
          description: CPF or CNPJ of the receiver.
          nullable: true
          type: string
        receiverInstitutionIspb:
          description: ISPB code of the institution that receives the Pix.
          nullable: true
          type: string
        receiverInstitutionName:
          description: Name of the institution that receives the Pix.
          nullable: true
          type: string
        receiverAccountNumber:
