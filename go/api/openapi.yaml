      - description: Transaction ID.
        example: PAYZU20260817B3PL8SG5WQ000000
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Return format.
        example: pdf
        explode: true
        in: query
        name: type
        required: false
        schema:
          default: pdf
          enum:
          - pdf
          - base64
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                base64:
                  summary: As Base64
                  value:
                    base64: "data:application/pdf;base64,JVBERi0xLjQKJ..."
              schema:
                $ref: "#/components/schemas/ProofResponse"
            application/pdf:
              schema:
                description: "Binary PDF (default format, when `type=pdf`)."
                format: binary
                type: string
          description: "Base64 if `type=base64`, otherwise binary PDF."
        "400":
          content:
            application/json:
              examples:
