    PostPixRequest:
      example:
        generatedName: John Doe
        expiresIn: 600
        amount: 10.9
        generatedDocument: "12345678901"
        clientReference: order_12345
        callbackUrl: https://webhook.cool/
        generatedEmail: john.doe@example.com
        virtualAccount: loja-centro-01
      properties:
        amount:
          description: Amount in BRL. Must be >= 1.
          example: 10.9
          minimum: 1
          type: number
        callbackUrl:
          description: URL for transaction notifications (http or https).
          example: https://webhook.cool/
          format: uri
          pattern: ^https?://
          type: string
        generatedName:
          description: Payer full name. Letters and spaces only.
          example: John Doe
          minLength: 1
          pattern: "^[a-zA-Z À-ÿ]+$"
          type: string
        generatedEmail:
          description: Payer email (optional).
          example: john.doe@example.com
          format: email
          type: string
        generatedDocument:
          description: "Payer CPF (11 digits) or CNPJ (14 digits), no punctuation,\
            \ with valid check digits."
          example: "12345678901"
          pattern: "^(\\d{11}|\\d{14})$"
          type: string
        expiresIn:
          description: Seconds until the QR Code expires.
          example: 600
          maximum: 172000
          type: number
        clientReference:
          description: "External reference (order, invoice, etc.). A clientReference\
            \ already used returns the transaction created with it."
          example: order_12345
          maxLength: 64
          type: string
        virtualAccount:
          description: "Virtual sub-account (up to 50 characters) to correlate stores,\
            \ branches, marketplaces. Returned in the callback."
          example: loja-centro-01
          maxLength: 50
          minLength: 1
          type: string
      required:
      - amount
    PostPixQrcodeReadRequest:
      example:
        emv: 00020101021226770014br.gov.bcb.pix2555api.payzu/pix/qr/v2/013318d6-2d7d-479e-8bb3-b5c7b9da688c5204000053039865802BR5916PAYZU
          6007SAOPAULO6217051320260118278956304EC55
      properties:
        emv:
          description: The EMV payload string from the Pix QR Code.
          example: 00020101021226770014br.gov.bcb.pix2555api.payzu/pix/qr/v2/013318d6-2d7d-479e-8bb3-b5c7b9da688c5204000053039865802BR5916PAYZU
            6007SAOPAULO6217051320260118278956304EC55
          minLength: 1
          type: string
      required:
      - emv
    PostWithdrawRequest:
      example:
        pixType: email
        amount: 2
        clientReference: withdraw_98765
        description: Weekly payout
        callbackUrl: https://webhook.cool/
        virtualAccount: loja-centro-01
        pixKey: teste@teste.com
      properties:
        amount:
          description: "Amount in BRL, with at most 2 decimal places. Must be >= 0.01."
          example: 2
          minimum: 0.01
          type: number
        pixKey:
          description: "Destination Pix key in the format of pixType: CPF or CNPJ\
            \ with valid check digits and no punctuation, phone as +55 followed by\
            \ area code and number, email, or random key (EVP)."
          example: teste@teste.com
          type: string
        pixType:
          description: Pix key type.
          enum:
          - cpf
          - cnpj
          - phone
          - email
          - evp
          example: email
          type: string
        callbackUrl:
          description: URL for transaction notifications (http or https).
          example: https://webhook.cool/
          format: uri
          pattern: ^https?://
          type: string
        clientReference:
          description: "External reference for this withdrawal. Repeating it with\
            \ the same amount and key returns the existing withdrawal; with different\
            \ data, the request is rejected with PZC210."
          example: withdraw_98765
          maxLength: 64
          type: string
        description:
          description: Optional description.
          example: Weekly payout
          type: string
        virtualAccount:
          description: "Virtual sub-account (up to 50 characters) to correlate stores,\
            \ branches, marketplaces. Returned in the callback."
          example: loja-centro-01
          maxLength: 50
          minLength: 1
          type: string
      required:
      - amount
      - pixKey
      - pixType
    PostWithdrawQrcodeRequest:
      example:
        amount: 20
        qrCode: 00020101021226770014br.gov.bcb.pix2555api.payzu/pix/qr/v2/013318d6-2d7d-479e-8bb3-b5c7b9da688c5204000053039865802BR5916PAYZU
          6007SAOPAULO6217051320260118278956304EC55
        clientReference: order-123
        description: Pagamento via QR Code
        callbackUrl: https://webhook.cool/
        virtualAccount: loja-centro-01
      properties:
        qrCode:
          description: Pix QR Code payload (EMV format).
          example: 00020101021226770014br.gov.bcb.pix2555api.payzu/pix/qr/v2/013318d6-2d7d-479e-8bb3-b5c7b9da688c5204000053039865802BR5916PAYZU
            6007SAOPAULO6217051320260118278956304EC55
          type: string
        amount:
          description: "Amount in BRL, with at most 2 decimal places. Optional: if\
            \ not provided, uses the QR Code's embedded value."
          example: 20
          minimum: 0.1
          type: number
        callbackUrl:
          description: URL for transaction notifications (http or https).
          example: https://webhook.cool/
          format: uri
          pattern: ^https?://
          type: string
        description:
          description: Optional description for the payment.
          example: Pagamento via QR Code
          type: string
        clientReference:
          description: "External reference for this withdrawal. Repeating it with\
            \ the same amount and QR Code returns the existing withdrawal; with different\
            \ data, the request is rejected with PZC210."
          example: order-123
          maxLength: 64
          type: string
        virtualAccount:
          description: "Virtual sub-account (up to 50 characters) to correlate stores,\
            \ branches, marketplaces. Returned in the callback."
          example: loja-centro-01
          maxLength: 50
          minLength: 1
          type: string
      required:
      - qrCode
    PostInfractionsDefenseRequest:
      properties:
        defense:
          description: "Defense text (max: 1000 characters)"
