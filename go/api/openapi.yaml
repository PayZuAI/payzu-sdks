  /withdraw/proof/{id}:
    get:
      description: "Retorna o comprovante da transação. Por padrão (`type=pdf`) a\
        \ resposta é o arquivo PDF; com `type=base64` é um JSON com o campo `base64`,\
        \ o PDF como data URI."
      operationId: get_withdraw_proof
      parameters:
      - description: ID da transação.
        example: PAYZU20260817B3PL8SG5WQ000000
        explode: false
        in: path
        name: id
        required: true
        schema:
          type: string
        style: simple
      - description: Formato de retorno.
        example: pdf
        explode: true
        in: query
        name: type
        required: false
        schema:
          default: pdf
          enum:
          - pdf
          - base64
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              examples:
                base64:
                  summary: Como Base64
                  value:
                    base64: "data:application/pdf;base64,JVBERi0xLjQKJ..."
              schema:
                $ref: "#/components/schemas/ProofResponse"
            application/pdf:
              schema:
                description: "PDF binário (formato padrão, quando `type=pdf`)."
                format: binary
                type: string
          description: Comprovante em PDF ou base64
        "400":
          content:
            application/json:
              examples:
                PZV001:
                  summary: Dados inválidos. Verifique os campos informados.
                  value:
                    status: ERROR
                    error: Bad Request
                    errorCode: PZV001
                    message: Dados inválidos. Verifique os campos informados.
                    statusCode: 400
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                    details:
                    - field: type
                      message: "Invalid option: expected one of \"base64\"|\"pdf\""
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Bad Request
        "401":
          content:
            application/json:
              examples:
                PZA100:
                  summary: Unauthorized
                  value:
                    status: ERROR
                    error: Unauthorized
                    errorCode: PZA100
                    message: Unauthorized
                    statusCode: 401
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Token Bearer ausente ou inválido
        "403":
          content:
            application/json:
              examples:
                PZA203:
                  summary: Acesso não permitido a partir do endereço de IP 203.0.113.10.
                  value:
                    status: ERROR
                    error: Forbidden
                    errorCode: PZA203
                    message: Acesso não permitido a partir do endereço de IP 203.0.113.10.
                    statusCode: 403
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZA205:
                  summary: Conta com token de saque exige IP cadastrado na whitelist.
                    Cadastre o IP de o...
                  value:
                    status: ERROR
                    error: Forbidden
                    errorCode: PZA205
                    message: Conta com token de saque exige IP cadastrado na whitelist.
                      Cadastre o IP de origem (203.0.113.10) antes de operar.
                    statusCode: 403
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Operação não permitida
        "404":
          content:
            application/json:
              examples:
                PZG404:
                  summary: Transação não encontrada
                  value:
                    status: ERROR
                    error: Not Found
                    errorCode: PZG404
                    message: Transação não encontrada
                    statusCode: 404
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Recurso não encontrado
        "422":
          content:
            application/json:
              examples:
                PZC320:
                  summary: Transação ainda não processada.
                  value:
                    status: ERROR
                    error: Unprocessable Entity
                    errorCode: PZC320
                    message: Transação ainda não processada.
                    statusCode: 422
                    requestId: cmbz0f8qk0001js04hp3e2n0f
                PZC321:
                  summary: "Comprovante indisponível: transação cancelada sem documento."
                  value:
                    status: ERROR
                    error: Unprocessable Entity
                    errorCode: PZC321
                    message: "Comprovante indisponível: transação cancelada sem documento."
                    statusCode: 422
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Operação recusada
        "500":
          content:
            application/json:
              examples:
                PZI103:
                  summary: Dado interno ausente para concluir a operação.
                  value:
                    status: ERROR
                    error: Internal Server Error
                    errorCode: PZI103
                    message: Dado interno ausente para concluir a operação.
                    statusCode: 500
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Erro interno
      security:
      - BearerAuth: []
      summary: Obter comprovante de saque
      tags:
      - Withdrawals
      x-codeSamples:
      - id: curl
        lang: bash
        label: cURL
        source: |-
          http_code=$(curl --request GET \
              --url 'https://api.pix.payzu.com.br/v1/withdraw/proof/PAYZU20260817B3PL8SG5WQ000000' \
              --header "Authorization: Bearer $PAYZU_TOKEN" \
              --output resposta \
              --write-out '%{http_code}')

          if [ "$http_code" = 200 ]; then
            mv resposta comprovante.pdf
          else
            cat resposta
          fi
      - id: js
        lang: js
        label: Node.js
        source: |-
          import { writeFile } from 'node:fs/promises';

          const url = 'https://api.pix.payzu.com.br/v1/withdraw/proof/PAYZU20260817B3PL8SG5WQ000000';

          const response = await fetch(url, {
            method: 'GET',
            headers: {
              Authorization: `Bearer ${process.env.PAYZU_TOKEN}`,
            },
          });

          if (response.ok) {
            await writeFile('comprovante.pdf', Buffer.from(await response.arrayBuffer()));
          } else {
            console.error(await response.json());
          }
      - id: python
        lang: python
        label: Python
        source: |-
          import os
          import requests

          response = requests.get(
              'https://api.pix.payzu.com.br/v1/withdraw/proof/PAYZU20260817B3PL8SG5WQ000000',
              headers={
                  'Authorization': f'Bearer {os.environ["PAYZU_TOKEN"]}',
              },
          )

          if response.ok:
              with open('comprovante.pdf', 'wb') as file:
                  file.write(response.content)
          else:
              print(response.json())
