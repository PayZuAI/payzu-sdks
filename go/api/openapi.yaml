                    statusCode: 404
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Resource not found
        "422":
          content:
            application/json:
              examples:
                PZK200:
                  summary: Invalid Pix key.
                  value:
                    status: ERROR
                    error: Unprocessable Entity
                    errorCode: PZK200
                    message: Invalid Pix key.
                    statusCode: 422
                    requestId: cmbz0f8qk0001js04hp3e2n0f
              schema:
                $ref: "#/components/schemas/ApiError"
          description: Operation refused
        "424":
          content:
            application/json:
              examples:
